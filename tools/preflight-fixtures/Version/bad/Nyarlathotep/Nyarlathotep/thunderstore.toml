[config]
schemaVersion = "0.0.1"

[package]
namespace = "kdpen"
name = "Nyarlathotep"
versionNumber = "0.1.1"
description = "Server-side chaos events for V Rising: timed faction empowerment, NPC sieges on castles, zones that call reinforcements, boss-fight adds, and admin-scheduled spawn waves. Everything admin-configured and off by default."
websiteUrl = "https://github.com/KDavidP1987/Nyarlathotep-Lord-of-Chaos"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_V_Rising = "1.733.2"
deca-VampireCommandFramework = "0.10.4"

[build]
icon = "icon.png"
readme = "README.md"
outdir = "build"

[[build.copy]]
source = "dist/BepInEx"
target = "BepInEx"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = ["v-rising"]

[publish.categories]
v-rising = ["mods", "server-side"]
